<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelloChat1</title>
  <style>
    body {
      margin: 0;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: #313338;
      color: #dbdee1;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #2b2d31;
      padding: 15px 20px;
      font-weight: bold;
      font-size: 18px;
      border-bottom: 1px solid #1f2023;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    header span { color: #80848e; font-size: 22px; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg-item {
      display: flex;
      flex-direction: column;
      background-color: #2b2d31;
      padding: 10px 14px;
      border-radius: 8px;
    }
    .msg-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 4px;
    }
    .msg-name { font-weight: bold; color: #f2f3f5; font-size: 15px; }
    .msg-time { font-size: 11px; color: #949ba4; }
    .msg-text { font-size: 15px; line-height: 1.4; word-break: break-all; }
    #input-area {
      background-color: #313338;
      padding: 15px 20px;
      display: flex;
      gap: 10px;
    }
    input {
      background-color: #383a40;
      border: none;
      color: #dbdee1;
      padding: 12px 15px;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }
    #name-input { width: 120px; }
    #text-input { flex: 1; }
    button {
      background-color: #5865f2;
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background-color: #4752c4; }
  </style>
</head>
<body>

  <header><span>#</span> 雑談チャンネル</header>

  <div id="messages"></div>

  <div id="input-area">
    <input type="text" id="name-input" placeholder="名前" value="名無し">
    <input type="text" id="text-input" placeholder="#雑談チャンネル へメッセージを送信">
    <button id="send-btn">送信</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://gstatic.com";

    const firebaseConfig = {
      apiKey: "AIzaSyC8PUGHCI90I0SACnhaSJvWa3ZezXTtA8M",
      authDomain: "://firebaseapp.com",
      projectId: "hellochat1-62589",
      storageBucket: "hellochat1-62589.firebasestorage.app",
      messagingSenderId: "891856165914",
      appId: "1:891856165914:web:c68718433a84cb539a45a3",
      measurementId: "G-9FMVX3HZHG"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const messagesRef = collection(db, "messages");

    const messagesDiv = document.getElementById("messages");
    const nameInput = document.getElementById("name-input");
    const textInput = document.getElementById("text-input");
    const sendBtn = document.getElementById("send-btn");

    async function sendMessage() {
      const name = nameInput.value.trim() || "名無し";
      const text = textInput.value.trim();
      if (!text) return;

      textInput.value = "";
      await addDoc(messagesRef, {
        name: name,
        text: text,
        createdAt: serverTimestamp()
      });
    }

    sendBtn.addEventListener("click", sendMessage);
    textInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    const q = query(messagesRef, orderBy("createdAt", "asc"));
    onSnapshot(q, (snapshot) => {
      messagesDiv.innerHTML = "";
      snapshot.forEach((doc) => {
        const data = doc.data();
        const timeStr = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "送信中...";
        
        const item = document.createElement("div");
        item.className = "msg-item";
        item.innerHTML = `
          <div class="msg-header">
            <span class="msg-name">${escapeHTML(data.name)}</span>
            <span class="msg-time">${timeStr}</span>
          </div>
          <div class="msg-text">${escapeHTML(data.text)}</div>
        `;
        messagesDiv.appendChild(item);
      });
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });

    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }
  </script>
</body>
</html>
