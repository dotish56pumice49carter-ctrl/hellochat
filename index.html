<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelloChat1</title>
  <style>
    body {
      margin: 0;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: #313338;
      color: #dbdee1;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #2b2d31;
      padding: 15px 20px;
      font-weight: bold;
      font-size: 18px;
      border-bottom: 1px solid #1f2023;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    header span { color: #80848e; font-size: 22px; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg-item {
      display: flex;
      flex-direction: column;
      background-color: #2b2d31;
      padding: 10px 14px;
      border-radius: 8px;
    }
    .msg-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 4px;
    }
    .msg-name { font-weight: bold; color: #f2f3f5; font-size: 15px; }
    .msg-time { font-size: 11px; color: #949ba4; }
    .msg-text { font-size: 15px; line-height: 1.4; word-break: break-all; }
    #input-area {
      background-color: #313338;
      padding: 15px 20px;
      display: flex;
      gap: 10px;
    }
    input {
      background-color: #383a40;
      border: none;
      color: #dbdee1;
      padding: 12px 15px;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }
    #name-input { width: 120px; }
    #text-input { flex: 1; }
    button {
      background-color: #5865f2;
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background-color: #4752c4; }
  </style>
</head>
<body>

  <header><span>#</span> 雑談チャンネル</header>

  <div id="messages"></div>

  <div id="input-area">
    <input type="text" id="name-input" placeholder="名前" value="名無し">
    <input type="text" id="text-input" placeholder="#雑談チャンネル へメッセージを送信">
    <button id="send-btn">送信</button>
  </div>

  <script>
    // URLが短縮されないように分割して読み込みます
    const base = "https://" + "://gstatic.com";
    const s1 = document.createElement("script");
    s1.src = base + "firebase-app-compat.js";
    s1.onload = () => {
      const s2 = document.createElement("script");
      s2.src = base + "firebase-firestore-compat.js";
      s2.onload = startChat;
      document.head.appendChild(s2);
    };
    document.head.appendChild(s1);

    function startChat() {
      const firebaseConfig = {
        apiKey: "AIzaSyC8PUGHCI90I0SACnhaSJvWa3ZezXTtA8M",
        authDomain: "hellochat1-62589.firebaseapp.com",
        projectId: "hellochat1-62589",
        storageBucket: "hellochat1-62589.firebasestorage.app",
        messagingSenderId: "891856165914",
        appId: "1:891856165914:web:c68718433a84cb539a45a3",
        measurementId: "G-9FMVX3HZHG"
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
      const messagesRef = db.collection("messages");

      const messagesDiv = document.getElementById("messages");
      const nameInput = document.getElementById("name-input");
      const textInput = document.getElementById("text-input");
      const sendBtn = document.getElementById("send-btn");

      async function sendMessage() {
        const name = nameInput.value.trim() || "名無し";
        const text = textInput.value.trim();
        if (!text) return;

        textInput.value = "";
        try {
          await messagesRef.add({
            name: name,
            text: text,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } catch (err) {
          alert("送信エラー: " + err.message);
        }
      }

      sendBtn.addEventListener("click", sendMessage);
      textInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
      });

      messagesRef.orderBy("createdAt", "asc").onSnapshot((snapshot) => {
        messagesDiv.innerHTML = "";
        snapshot.forEach((doc) => {
          const data = doc.data();
          const timeStr = data.createdAt
            ? new Date(data.createdAt.toDate()).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
            : "送信中...";

          const item = document.createElement("div");
          item.className = "msg-item";

          const header = document.createElement("div");
          header.className = "msg-header";

          const nameSpan = document.createElement("span");
          nameSpan.className = "msg-name";
          nameSpan.textContent = data.name;

          const timeSpan = document.createElement("span");
          timeSpan.className = "msg-time";
          timeSpan.textContent = timeStr;

          const textDiv = document.createElement("div");
          textDiv.className = "msg-text";
          textDiv.textContent = data.text;

          header.appendChild(nameSpan);
          header.appendChild(timeSpan);
          item.appendChild(header);
          item.appendChild(textDiv);
          messagesDiv.appendChild(item);
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      });
    }
  </script>
</body>
</html>
